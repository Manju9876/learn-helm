apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.appName }}-service
  labels:
    appName: {{ .Values.appName }}-service
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      appName: {{ .Values.appName }}-service
  template:
    metadata:
      labels:
        appName: {{ .Values.appName }}-service
    spec:
      containers:
        - name: {{ .Values.appName }}-service
          image: 200915316788.dkr.ecr.us-east-1.amazonaws.com/{{ .Values.appName }}
          envFrom:
            - configMapRef:
                name: {{ .Values.appName }}-service